name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

permissions:
  contents: read
  security-events: write  # Required for SARIF upload
  packages: write          # Required for GHCR Docker push

jobs:
  # ============ BUILD & TEST ============
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify module checksums
        run: go mod verify

      - name: Scan for known CVEs (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out

      - name: Build binary
        run: |
          make build EXTRA_LDFLAGS="-X github.com/filipi86/drogonsec/internal/cli.Environment=production"

  # ============ LINT ============
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  # ============ SECURITY SCAN (Dogfooding - DrogonSec scanning itself) ============
  security-scan:
    name: Security Scan (DrogonSec)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Build DrogonSec
        run: make build

      - name: Scan with DrogonSec (SARIF output)
        continue-on-error: true
        run: |
          ./bin/drogonsec scan . \
            --format sarif \
            --output drogonsec.sarif \
            --severity MEDIUM

      - name: Upload SARIF to GitHub Security
        if: hashFiles('drogonsec.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: drogonsec.sarif
        continue-on-error: true

  # ============ RELEASE ============
  release:
    name: Release Binaries
    runs-on: ubuntu-latest
    needs: [ build-test, lint ]
    if: github.event_name == 'release'
    # Overrides the workflow-level `contents: read`, which makes the asset
    # upload fail with "Resource not accessible by integration". Scoped to this
    # job so the other jobs keep read-only access to the repository contents.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      # The tag is passed explicitly: actions/checkout does a shallow clone, so
      # the `git describe` the Makefile falls back to cannot see the tag.
      - name: Build all platforms
        run: |
          make release \
            VERSION="${GITHUB_REF_NAME#v}" \
            EXTRA_LDFLAGS="-X github.com/filipi86/drogonsec/internal/cli.Environment=production"

      - name: Create checksums
        run: |
          cd bin
          sha256sum drogonsec-* > SHA256SUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            bin/drogonsec-linux-amd64
            bin/drogonsec-linux-arm64
            bin/drogonsec-darwin-amd64
            bin/drogonsec-darwin-arm64
            bin/drogonsec-windows-amd64.exe
            bin/SHA256SUMS.txt

  # ============ DOCKER ============
  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: [ build-test ]
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
